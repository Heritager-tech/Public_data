body { background: var(--bg); color: var(--fg); }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg); }
::selection { background: rgba(139, 92, 246, 0.3); }

/* ===== NAVIGATION ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: var(--nav-bg); border-bottom: 1px solid var(--nav-border);
}
.nav-inner {
  max-width: 80rem; margin: 0 auto; padding: 0 1.5rem;
  display: flex; align-items: center; justify-content: space-between; height: 64px;
}
.nav-logo { display: flex; align-items: center; gap: 12px; }
.nav-logo-icon { width: 36px; height: 36px; object-fit: contain; }
.nav-logo-text { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; }
.nav-logo-dash { color: var(--muted); }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link {
  padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
  transition: all 0.2s; color: var(--muted);
}
.nav-link:hover { color: var(--fg); background: var(--hover-accent); }
.nav-link.active { background: var(--primary); color: var(--primary-fg); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.nav-actions { display: flex; align-items: center; gap: 8px; }
.nav-btn {
  padding: 8px; border-radius: 8px; transition: background 0.2s; color: var(--fg);
  display: flex; align-items: center; justify-content: center;
}
.nav-btn:hover { background: var(--hover-accent); }
.nav-btn svg { width: 20px; height: 20px; }
.mobile-menu { display: none; }
.mobile-dropdown { display: none; border-top: 1px solid var(--nav-border); background: var(--nav-bg); backdrop-filter: blur(20px); padding: 12px 16px; }
.mobile-dropdown.open { display: flex; flex-direction: column; gap: 4px; }
.mobile-link {
  padding: 10px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
  text-align: left; transition: all 0.2s; color: var(--muted);
}
.mobile-link:hover { color: var(--fg); background: var(--hover-accent); }
.mobile-link.active { background: var(--primary); color: var(--primary-fg); }

@media (max-width: 768px) {
  .nav-links { display: none; }
  .mobile-menu { display: flex; }
}

/* ===== MAIN CONTENT ===== */
.main { padding-top: 64px; min-height: 100vh; }
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== HOME PAGE ===== */
.home-section {
  position: relative; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 5rem 1.5rem; overflow: hidden;
}
.home-section-1 { min-height: 70vh; }
.home-section-block { min-height: 60vh; }
.home-tree { width: 20rem; height: auto; margin-bottom: 2rem; transition: opacity 0.8s; }
.home-title { font-size: clamp(1.875rem, 1.5rem + 1.5vw, 3rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 1rem; text-align: center; }
.home-subtitle { font-size: clamp(1rem, 0.9rem + 0.5vw, 1.25rem); color: var(--muted); text-align: center; max-width: 42rem; margin: 0 auto; }

.info-block {
  max-width: 56rem; width: 100%; border-radius: 1rem; padding: 2rem;
  backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
  animation: slideUp 0.6s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.info-block-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
.info-block-icon { padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.info-block-icon svg { width: 24px; height: 24px; }
.info-block-title { font-size: clamp(1.5rem, 1.25rem + 0.75vw, 1.875rem); font-weight: 700; }
.info-block-desc { color: var(--muted); font-size: 1rem; line-height: 1.7; margin-bottom: 1.5rem; }

.info-chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.info-chip {
  display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
  transition: transform 0.2s;
}
.info-chip:hover { transform: translateY(-2px); }
.info-chip svg { width: 20px; height: 20px; flex-shrink: 0; }
.info-chip span { font-size: 0.875rem; font-weight: 500; }

.divider { width: 100%; height: 1px; }

/* ===== FOOTER ===== */
.footer { padding: 4rem 1.5rem; text-align: center; }
.footer-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
.footer-desc { color: var(--muted); font-size: 0.875rem; max-width: 28rem; margin: 0 auto 2rem; }
.footer-contacts { display: flex; align-items: center; justify-content: center; gap: 1.5rem; color: var(--muted); font-size: 0.875rem; }
.footer-copy { font-size: 0.75rem; color: var(--muted); opacity: 0.6; margin-top: 1rem; }

/* ===== SERVICES PAGE ===== */
.services-header { padding: 2rem 1.5rem 1.5rem; max-width: 72rem; margin: 0 auto; }
.services-title { font-size: clamp(1.875rem, 1.5rem + 1vw, 2.5rem); font-weight: 800; margin-bottom: 0.5rem; }
.services-subtitle { color: var(--muted); font-size: 1.125rem; }
.services-tabs {
  display: flex; gap: 8px; padding: 6px; border-radius: 12px;
  background: var(--accent-bg); max-width: 72rem; margin: 0 auto 2rem;
  margin-left: 1.5rem; margin-right: 1.5rem;
  flex-wrap: wrap;
}
.services-tab {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
  transition: all 0.2s; color: var(--muted); flex: 1; min-width: 120px;
}
.services-tab:hover { color: var(--fg); }
.services-tab.active { box-shadow: 0 0 20px rgba(0,0,0,0.05); }
.services-tab svg { width: 20px; height: 20px; flex-shrink: 0; }
.services-content { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem 3rem; animation: fadeIn 0.3s ease; }
.services-content-header { margin-bottom: 3rem; }
.services-content-header-inner { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
.services-content-icon { padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.services-content-icon svg { width: 24px; height: 24px; }
.services-content-title { font-size: clamp(1.5rem, 1.25rem + 0.75vw, 1.875rem); font-weight: 700; }
.services-content-subtitle { font-size: 0.875rem; }
.services-content-desc { color: var(--muted); font-size: 1rem; line-height: 1.7; max-width: 56rem; }
.services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.service-card {
  border-radius: 12px; padding: 1.5rem; border: 1px solid var(--card-border);
  background: var(--card-bg); transition: all 0.3s;
}
.service-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.08); transform: translateY(-2px); }
.service-card-icon { padding: 10px; border-radius: 8px; width: fit-content; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; }
.service-card-icon svg { width: 24px; height: 24px; }
.service-card-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
.service-card-text { font-size: 0.875rem; color: var(--muted); line-height: 1.6; }

/* ===== VISION PAGE ===== */
.vision-page { display: none; height: calc(100vh - 64px); overflow: hidden; }
.vision-page.active { display: flex; }

.vision-sidebar {
  width: 240px; flex-shrink: 0; border-right: 1px solid;
  overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px;
}
.vision-sidebar-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 12px 9px 5px;
}
.vision-sidebar-btn {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-radius: 8px; font-size: 0.75rem; font-weight: 500;
  transition: all 0.15s; border: 1px solid transparent; text-align: left;
}
.vision-sidebar-btn:hover { opacity: 0.8; }
.vision-sidebar-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.vision-sidebar-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.vision-sidebar-btn .chevron { width: 12px; height: 12px; margin-left: auto; }
.vision-legend {
  margin-top: auto; padding: 9px; border-radius: 8px; font-size: 11px; line-height: 1.5;
}

.vision-main { flex: 1; overflow-y: auto; position: relative; }
.vision-overview {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100%; padding: 2rem;
}
.vision-cube { margin-bottom: 2rem; position: relative; }
.vision-cube-container { width: 160px; height: 160px; position: relative; perspective: 600px; }
.vision-cube-inner { position: absolute; inset: 0; transform: rotateX(-20deg) rotateY(35deg); transform-style: preserve-3d; }
.vision-cube-face {
  position: absolute; width: 128px; height: 128px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; backdrop-filter: blur(4px);
}
.vision-cube-face span { font-size: 11px; font-weight: 700; }
.vision-overview-title { font-size: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
.vision-overview-subtitle { font-size: 14px; line-height: 1.6; margin-bottom: 2rem; }
.vision-prism-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.vision-prism-btn {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-radius: 8px; font-size: 0.875rem; font-weight: 500;
  transition: all 0.2s; border: 1px solid;
}
.vision-prism-btn:hover { transform: scale(1.05); }
.vision-prism-btn .dot { width: 8px; height: 8px; border-radius: 50%; }

/* Vision detail */
.vision-detail { display: none; flex-direction: column; height: 100%; animation: slideRight 0.25s ease; }
.vision-detail.active { display: flex; }
@keyframes slideRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

.vision-detail-header {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid; position: sticky; top: 0; z-index: 10; flex-shrink: 0;
}
.vision-back-btn {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-radius: 6px; font-size: 0.75rem; border: 1px solid;
}
.vision-back-btn svg { width: 12px; height: 12px; }
.vision-detail-info { flex: 1; }
.vision-detail-title { font-size: clamp(1.25rem, 1rem + 0.75vw, 1.75rem); font-weight: 800; letter-spacing: -0.03em; }
.vision-detail-subtitle { font-size: 11.5px; margin-top: 1px; }
.vision-detail-badge {
  font-size: 10.5px; padding: 3px 8px; border-radius: 99px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
}

.vision-detail-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

.vision-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.vision-kpi { border-radius: 12px; padding: 16px; border: 1px solid; }
.vision-kpi-value { font-size: clamp(1.25rem, 1rem + 0.75vw, 1.75rem); font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.vision-kpi-label { font-size: 11px; margin-top: 2px; }

.vision-section { border-radius: 12px; padding: 16px; border: 1px solid; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.vision-section-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; }

.vision-concepts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.vision-concept { padding: 12px; border-radius: 8px; border-left: 3px solid; }
.vision-concept-title { font-weight: 700; font-size: 11px; margin-bottom: 4px; }
.vision-concept-text { font-size: 11px; line-height: 1.5; }

.vision-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.vision-flow-step { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; border: 1px solid; }
.vision-flow-arrow { font-size: 14px; }

.vision-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.vision-table th { text-align: left; padding: 8px 12px; font-weight: 600; border-bottom: 1px solid; }
.vision-table td { padding: 8px 12px; border-bottom: 1px solid; }
.vision-table tr:hover { opacity: 0.8; transition: opacity 0.15s; }

/* Responsive sidebar */
@media (max-width: 1024px) {
  .vision-sidebar { display: none; }
  .vision-mobile-nav { display: flex !important; }
}
.vision-mobile-nav { display: none; gap: 8px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid; }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .home-tree { width: 12rem; }
  .info-block { padding: 1.5rem; }
  .info-chips { grid-template-columns: 1fr; }
  .vision-kpis { grid-template-columns: 1fr; }
  .vision-concepts { grid-template-columns: 1fr; }
  .services-tabs { flex-direction: column; }
  .footer-contacts { flex-direction: column; gap: 0.5rem; }
}
</style>

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  renderAll();
}

function toggleMobileMenu() {
  const dd = document.getElementById('mobile-dropdown');
  dd.classList.toggle('open');
  const btn = document.getElementById('mobile-menu-btn');
  btn.innerHTML = dd.classList.contains('open') ? icons.x : icons.menu;
}

// ===== PAGE SWITCHING =====
function switchPage(page) {
  currentPage = page;
  // Update nav links
  document.querySelectorAll('.nav-link, .mobile-link').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  // Show/hide pages
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  const visionPage = document.getElementById('page-vision');
  visionPage.classList.toggle('active', page === 'vision');
}

// ===== RENDER =====
function renderAll() {
  const c = getThemeColors();
  // Theme button
  document.getElementById('theme-btn').innerHTML = isDark ? icons.sun : icons.moon;
  // Logo
  document.getElementById('nav-logo').src = isDark ? LOGO_LIGHT : LOGO_DARK;
  // Render pages
  renderHome(c);
  renderServices(c);
  renderVision(c);
}

function renderVision(c) {
  const el = document.getElementById('page-vision');
  el.style.background = c.bg;

  // Sidebar
  let sidebarHtml = `
    <div class="vision-sidebar-label" style="color:${c.faint}">Призмы видения</div>
    <button class="vision-sidebar-btn" style="background:${!activePrism ? c.surfdyn : 'transparent'};color:${!activePrism ? c.pri : c.muted};border:1px solid ${!activePrism ? c.brd : 'transparent'}"
      onclick="activePrism=null;renderVision(getThemeColors())">
      ${icons.box} <span>Обзор (куб)</span>
    </button>
  `;
  prismsData.forEach(p => {
    const pColor = c[p.colorKey];
    const isActive = activePrism === p.id;
    sidebarHtml += `
      <button class="vision-sidebar-btn" style="background:${isActive ? pColor+'15' : 'transparent'};color:${isActive ? pColor : c.muted};border:1px solid ${isActive ? pColor+'33' : 'transparent'}"
        onclick="activePrism='${p.id}';renderVision(getThemeColors())">
        <div class="dot" style="background:${pColor}"></div>
        ${icons[p.iconKey]}
        <span>${p.label}</span>
        ${isActive ? '<span class="chevron">'+icons.chevronRight+'</span>' : ''}
      </button>
    `;
  });
  sidebarHtml += `
    <div class="vision-sidebar-label" style="color:${c.faint}">Легенда</div>
    <div class="vision-legend" style="background:${c.surfoff};color:${c.muted}">
      Выберите призму для детализации. Каждая призма раскрывает измерение видения компании.
    </div>
  `;

  // Mobile nav
  let mobileNavHtml = `<div class="vision-mobile-nav" style="border-color:${c.brd};background:${c.surf}">
    <button class="vision-prism-btn" style="background:${!activePrism ? c.surfdyn : 'transparent'};color:${!activePrism ? c.pri : c.muted};border-color:${!activePrism ? c.brd : 'transparent'}"
      onclick="activePrism=null;renderVision(getThemeColors())">
      ${icons.box} <span>Обзор</span>
    </button>`;
  prismsData.forEach(p => {
    const pColor = c[p.colorKey];
    const isActive = activePrism === p.id;
    mobileNavHtml += `
      <button class="vision-prism-btn" style="background:${pColor}18;border-color:${pColor}44;color:${pColor}"
        onclick="activePrism='${p.id}';renderVision(getThemeColors())">
        <div class="dot" style="background:${pColor}"></div> ${p.label}
      </button>`;
  });
  mobileNavHtml += '</div>';

  // Main content
  let mainHtml = '';
  if (!activePrism) {
    // Overview / Cube
    mainHtml = `
      <div class="vision-overview">
        <div class="vision-cube">
          <div class="vision-cube-container">
            <div class="vision-cube-inner">
              <div class="vision-cube-face" style="background:${c.pri}44;border:1px solid ${c.pri}66;transform:translateZ(64px) translateX(16px)">
                <span style="color:${c.pri}">Миссия</span>
              </div>
              <div class="vision-cube-face" style="background:${c.org}44;border:1px solid ${c.org}66;transform:rotateY(90deg) translateZ(80px) translateX(16px)">
                <span style="color:${c.org}">Стратегия</span>
              </div>
              <div class="vision-cube-face" style="background:${c.red}44;border:1px solid ${c.red}66;transform:rotateX(90deg) translateZ(0px) translateX(16px) translateY(-16px)">
                <span style="color:${c.red}">Трансформация</span>
              </div>
            </div>
          </div>
        </div>
        <h2 class="vision-overview-title" style="color:${c.txt}">Архитектурный куб видения</h2>
        <p class="vision-overview-subtitle" style="color:${c.muted}">3 призмы — 3 измерения видения компании.<br>Каждая призма раскрывает один аспект трансформационного пути.</p>
        <div class="vision-prism-btns">
          ${prismsData.map(p => {
            const pColor = c[p.colorKey];
            return `<button class="vision-prism-btn" style="background:${pColor}18;border-color:${pColor}44;color:${pColor}" onclick="activePrism='${p.id}';renderVision(getThemeColors())"><div class="dot" style="background:${pColor}"></div> ${p.label}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  } else {
    const p = prismsData.find(x => x.id === activePrism);
    const pColor = c[p.colorKey];

    let kpisHtml = p.kpis.map(k => `
      <div class="vision-kpi" style="background:${c.surf};border-color:${c.brd}">
        <div class="vision-kpi-value" style="color:${pColor}">${k.value}</div>
        <div class="vision-kpi-label" style="color:${c.muted}">${k.label}</div>
      </div>
    `).join('');

    let sectionsHtml = p.sections.map(s => {
      let content = '';
      if (s.type === 'concept') {
        content = `<div class="vision-concepts">${s.items.map(item => `
          <div class="vision-concept" style="background:${c.surfoff};border-left-color:${c[item.accentKey]}">
            <div class="vision-concept-title" style="color:${c[item.accentKey]}">${item.title}</div>
            <div class="vision-concept-text" style="color:${c.muted}">${item.text}</div>
          </div>`).join('')}</div>`;
      } else if (s.type === 'flow') {
        content = `<div class="vision-flow">${s.steps.map((step, i) => `
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="vision-flow-step" style="background:${pColor}{isDark ? (8 + i*5).toString(16).padStart(2,'0') : (8 + i*4).toString(16).padStart(2,'0')};border-color:${pColor}40;color:${c.txt}">${step}</div>
            ${i < s.steps.length - 1 ? '<span class="vision-flow-arrow" style="color:'+c.faint+'">&#8250;</span>' : ''}
          </div>`).join('')}</div>`;
      } else if (s.type === 'table') {
        content = `<table class="vision-table">
          <thead><tr>${s.headers.map(h => `<th style="background:${c.surfoff};color:${c.muted};border-bottom-color:${c.brd}">${h}</th>`).join('')}</tr></thead>
          <tbody>${s.rows.map(row => `<tr>${row.map((cell, ci) => `<td style="border-bottom-color:${c.brd}50;color:${ci === 0 ? c.txt : c.muted};font-weight:${ci === 0 ? 500 : 400}">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>`;
      }
      return `<div class="vision-section" style="background:${c.surf};border-color:${c.brd}">
        <div class="vision-section-title" style="color:${c.muted}">${s.title}</div>
        ${content}
      </div>`;
    }).join('');

    mainHtml = `
      <div class="vision-detail active">
        <div class="vision-detail-header" style="background:${c.surf};border-color:${c.brd}">
          <button class="vision-back-btn" style="color:${c.muted};border-color:${c.brd}" onclick="activePrism=null;renderVision(getThemeColors())">
            ${icons.arrowLeft} Куб
          </button>
          <div class="vision-detail-info">
            <div class="vision-detail-title" style="color:${c.txt}">${p.title}</div>
            <div class="vision-detail-subtitle" style="color:${c.muted}">${p.subtitle}</div>
          </div>
          <span class="vision-detail-badge" style="background:${pColor}18;color:${pColor}">${p.badge}</span>
        </div>
        <div class="vision-detail-body">
          <div class="vision-kpis">${kpisHtml}</div>
          ${sectionsHtml}
        </div>
      </div>
    `;
  }

  el.innerHTML = `
    <aside class="vision-sidebar" style="background:${c.surf};border-color:${c.brd}">${sidebarHtml}</aside>
    ${mobileNavHtml}
    <main class="vision-main">${mainHtml}</main>
  `;
}
